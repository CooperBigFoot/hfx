[project]
name = "hfx-watershed-comparison"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["cartopy>=0.25,<0.26", "shapely>=2.1,<3", "pyproj>=3.7,<4", "matplotlib>=3.10,<4", "psutil>=7,<8", "pydantic>=2.11,<3"]
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12"]
[project.scripts]
hfx-watershed = "watershed_comparison.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["watershed_comparison"]
